<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Payroll System</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-container">
                <h1>🔐</h1>
                <h2>PAYROLL SYSTEM</h2>
                <p>STEAM MP 7000</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>ID</label>
                    <input type="text" id="id" placeholder="Masukkan ID Anda" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Masukkan Password" required>
                </div>
                <button type="submit" class="btn-primary">LOGIN</button>
            </form>
            
            <div id="message" class="message-box"></div>
        </div>
        
        <div class="footer">
            <p>© 2026 Steam MP 7000</p>
        </div>
    </div>

    <script src="Script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const id = document.getElementById('id').value.trim();
            const password = document.getElementById('password').value.trim();
            const messageDiv = document.getElementById('message');
            
            // Reset pesan
            messageDiv.className = 'message-box';
            messageDiv.textContent = '';
            messageDiv.style.display = 'block';
            
            if (!id || !password) {
                messageDiv.className = 'message-box error';
                messageDiv.textContent = 'ID dan Password wajib diisi!';
                return;
            }
            
            // Tampilkan loading
            const btn = this.querySelector('button');
            const btnText = btn.textContent;
            btn.textContent = 'Loading...';
            btn.disabled = true;
            
            try {
                console.log('Mengirim request ke:', SCRIPT_URL);
                console.log('Data:', { id: id, password: password });
                
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'login',
                        id: id,
                        password: password
                    })
                });
                
                console.log('Response status:', response.status);
                
                const result = await response.json();
                console.log('Hasil response:', result);
                
                if (result.success) {
                    // Simpan token dan data user
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    
                    messageDiv.className = 'message-box success';
                    messageDiv.textContent = 'Login berhasil! Mengalihkan...';
                    
                    setTimeout(() => {
                        if (result.user.jabatan === 'Owner' || result.user.jabatan === 'Admin') {
                            window.location.href = 'Dashboard_Owner.html';
                        } else if (result.user.jabatan === 'Kepala Toko') {
                            window.location.href = 'Dashboard_KT.html';
                        } else {
                            window.location.href = 'Dashboard_Karyawan.html';
                        }
                    }, 1000);
                    
                } else {
                    messageDiv.className = 'message-box error';
                    messageDiv.textContent = result.message || 'Login gagal';
                }
            } catch (error) {
                console.error('Error detail:', error);
                messageDiv.className = 'message-box error';
                messageDiv.textContent = 'Gagal terhubung ke server. Periksa koneksi internet.';
            } finally {
                btn.textContent = btnText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
